name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jood
          POSTGRES_PASSWORD: jood_ci
          POSTGRES_DB: jood_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jood"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://jood:jood_ci@localhost:5432/jood_test?schema=public
      SESSION_SECRET: ci_secret_ci_secret_ci_secret_ci_secret
      PUBLIC_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w server
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
